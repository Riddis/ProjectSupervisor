[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-framework"
version = "1.11.0"
description = "Run a project with AI agents under a deterministic Python supervisor and an owner-facing Control Center"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "ruamel.yaml>=0.18",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "portalocker>=2.8",
  "python-ulid>=2.2",
  "pillow>=10.3",
  "requests>=2.31",
  "jsonschema>=4.21",
  "packaging>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-timeout>=2.3", "ruff>=0.5", "httpx>=0.27"]
ui = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "sse-starlette>=2.1"]

[project.scripts]
supervisor = "supervisor.cli:main"

[tool.setuptools.packages.find]
include = ["supervisor*"]

[tool.setuptools.package-data]
supervisor = ["template/**/*", "template/**/.*", "template/**/_dot_*", "extension_template/**/*",
              "ui/templates/**/*", "ui/static/**/*", "_vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=runs/pytest_tmp"
pythonpath = ["."]
markers = ["capacity_integration: may call the real Codex CLI usage RPC (off by default; see tests/conftest.py)",
           "model_integration: may launch the real Claude/Codex CLI (off by default; see tests/conftest.py)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
