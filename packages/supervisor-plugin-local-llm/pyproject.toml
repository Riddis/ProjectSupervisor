[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-plugin-local-llm"
version = "1.1.0"
description = "A Supervisor plugin: local_llm"
readme = "README.md"
requires-python = ">=3.11"
# The framework is not listed: it is not on an index, and the manifest's `framework` range is what the loader checks.
dependencies = ["pydantic>=2.7", "requests>=2.31", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.entry-points."supervisor.plugins"]
local_llm = "supervisor_plugin_local_llm"

[tool.setuptools.packages.find]
include = ["supervisor_plugin_local_llm*"]

[tool.setuptools.package-data]
"supervisor_plugin_local_llm" = ["supervisor-plugin.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# What CI drives on the installed wheel when this package lives under the framework repository's packages/
# (tools/ci_package.py there): `lane`, `python_job`, and a `config` table for its plugins.<identity> section.
# `lane` is left unset although this package does register an adapter: the lane talks HTTP to a model server on
# the loopback address and holds the GPU slot, and a CI runner has neither. tools/ci_installed_plugin.py --lane
# plants a task with an `output` key no process-family adapter honours and requires it to reach COMPLETE, so
# naming this lane there is a job that cannot pass. CI drives steps 1-3 (found as installed, loaded, G5) plus
# this package's own suite, which stands up a fake server of its own. Left unset deliberately, not forgotten.
