# The plugin's manifest (docs/PLUGIN_STANDARD.md in the framework repo). The framework reads it before importing
# anything here: keep it in step with what setup() registers (`supervisor plugin check llm_endpoint` proves it).
identity = "llm_endpoint"
version = "1.0.0"
framework = ">=2.6,<3"

[provides]
adapters = ["llm_endpoint"]
doctor_checks = ["llm_endpoint"]
commands = ["llm_endpoint.start", "llm_endpoint.stop"]
inbox_kinds = ["llm_endpoint_capacity"]

[config]
section = "plugins.llm_endpoint"
schema = "supervisor_plugin_llm_endpoint.config:Settings"

[requires]
resources = ["gpu"]
