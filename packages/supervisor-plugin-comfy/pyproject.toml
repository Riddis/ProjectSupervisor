[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-plugin-comfy"
version = "1.0.0"
description = "A Supervisor plugin: comfy"
readme = "README.md"
requires-python = ">=3.11"
# The framework is not listed: it is not on an index, and the manifest's `framework` range is what the loader checks.
dependencies = ["pydantic>=2.7", "requests>=2.31", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
ws = ["websocket-client>=1.7"]   # optional: best-effort /ws progress polling degrades quietly without it

[project.entry-points."supervisor.plugins"]
comfy = "supervisor_plugin_comfy"

[tool.setuptools.packages.find]
include = ["supervisor_plugin_comfy*"]

[tool.setuptools.package-data]
"supervisor_plugin_comfy" = ["supervisor-plugin.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # the package importable straight from source, no editable install needed to run its own suite

# What CI drives on the installed wheel when this package lives under the framework repository's packages/
# (tools/ci_package.py there): `lane`, `python_job`, and a `config` table for its plugins.<identity> section.
# `lane` is left unset although this package does register an adapter: the lane talks HTTP to a generation server
# on the loopback address and holds the GPU slot, and a CI runner has neither. tools/ci_installed_plugin.py --lane
# plants a task with an `output` key no process-family adapter honours and requires it to reach COMPLETE, so naming
# this lane there is a job that cannot pass. CI drives steps 1-3 (found as installed, loaded, G5) plus this
# package's own suite. Left unset deliberately, not forgotten (packages/supervisor-plugin-local-llm/pyproject.toml
# documents the same finding, proven there against a restored `lane` setting).
