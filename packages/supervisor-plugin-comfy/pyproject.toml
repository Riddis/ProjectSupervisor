[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-plugin-comfy"
version = "0.1.0"
description = "A Supervisor plugin: comfy"
readme = "README.md"
requires-python = ">=3.11"
# The framework is not listed: it is not on an index, and the manifest's `framework` range is what the loader checks.
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.entry-points."supervisor.plugins"]
comfy = "supervisor_plugin_comfy"

[tool.setuptools.packages.find]
include = ["supervisor_plugin_comfy*"]

[tool.setuptools.package-data]
"supervisor_plugin_comfy" = ["supervisor-plugin.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# What CI drives on the installed wheel when this package lives under the framework repository's packages/
# (tools/ci_package.py there): `lane`, `python_job`, and a `config` table for its plugins.<identity> section.
# This package's lane (boundary plan phase 5, step 3) has not moved in yet, and `lane` will stay unset after it
# does: that lane drives a generation service over HTTP and needs a GPU, which a CI runner has neither of, and
# tools/ci_installed_plugin.py --lane plants a task with an `output` key no process-family adapter honours and
# requires it to reach COMPLETE. CI drives steps 1-3 (found as installed, loaded, G5) plus this package's own
# suite. Left unset deliberately, not forgotten.
