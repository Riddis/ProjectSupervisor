[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-ext-reference"
version = "1.0.0"
description = "The Supervisor reference extension: every registry hook, through supervisor.ext only"
requires-python = ">=3.11"
# The framework is not listed: it is on no index; the manifest's `framework` range is what the loader checks.
dependencies = ["pydantic>=2.7"]

[project.entry-points."supervisor.extensions"]
reference = "reference"

[tool.setuptools.packages.find]
include = ["reference*"]

[tool.setuptools.package-data]
reference = ["supervisor-extension.toml", "templates/*", "static/*"]
