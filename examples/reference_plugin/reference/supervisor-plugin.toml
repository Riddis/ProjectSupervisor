# The reference plugin's manifest (docs/PLUGIN_STANDARD.md). The framework reads it before importing anything
# here; `supervisor plugin check reference` (gate G5) proves setup() registers exactly what [provides] lists.
identity = "reference"
version = "1.0.0"
framework = ">=1.12,<2"

[provides]
adapters = ["reference_lane"]
python_jobs = ["reference_count"]
commands = ["reference.note", "reference.close"]
inbox_kinds = ["reference_note"]
doctor_checks = ["reference"]
cli = ["reference"]
routes = ["/reference"]
static = ["reference"]
projections = ["reference_notes"]
hooks = ["overview_panel", "packet_screen", "template_dir"]

[config]
section = "plugins.reference"
schema = "reference.config:Settings"
legacy_sections = ["reference"]

[requires]
resources = ["gpu"]
