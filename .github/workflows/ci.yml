# Framework CI (docs/BOUNDARY.md): gate G1 (boundary check), gate G2 (the plugin API contract, from 1.11.0),
# gate G3 (the suite on Linux and Windows, the template smoke test included) and gate G5 (the reference plugin
# as an installed package, from 1.12.0), and from 1.14.0 a job per plugin package kept under packages/. They are
# required checks on main through branch protection, so a pull request that fails one cannot merge.
# A local run gives the same verdict:
#   python -m supervisor.boundary        python -m supervisor.api_contract check        python -m pytest -q
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    name: G1 boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: supervisor.boundary (standard library only, no install)
        run: python -B -m supervisor.boundary

  api_contract:
    name: G2 plugin API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history and tags: the previous release's contract is read from its tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: python -m pip install -e ".[ui]"
      - name: supervisor.api_contract check (against the last release tag)
        run: python -B -m supervisor.api_contract check

  suite:
    name: G3 suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: python -m pip install -e ".[dev,ui]"
      - name: pytest
        run: python -m pytest -q

  g5_reference:
    # Gate G5 and the phase 3 gate (docs/PLUGIN_STANDARD.md): the reference plugin installed as a package into
    # a fresh environment, with its source out of reach, is discovered through its entry point, approved without
    # import, loaded, passes `supervisor plugin check`, and completes a task on its lane. The same as an editable
    # install. A package generated by `supervisor plugin new --package` runs its complete suite.
    name: G5 reference plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: the framework into a fresh environment (built, not editable)
        run: |
          PY="$RUNNER_TEMP/env/bin/python"
          python -m venv "$RUNNER_TEMP/env"
          "$PY" -m pip install ".[dev,ui]"
          cp tools/ci_installed_plugin.py "$RUNNER_TEMP/"
      - name: the reference plugin as a wheel, its source out of reach
        run: |
          PY="$RUNNER_TEMP/env/bin/python"
          "$PY" -m pip wheel --no-deps -w "$RUNNER_TEMP/wheels" examples/reference_plugin
          mv examples "$RUNNER_TEMP/examples-out-of-reach"
          "$PY" -m pip install --no-deps "$RUNNER_TEMP"/wheels/supervisor_plugin_reference-*.whl
          cd "$RUNNER_TEMP" && "$PY" ci_installed_plugin.py reference --lane reference_lane --python-job reference_count
      - name: the reference plugin as an editable install
        run: |
          PY="$RUNNER_TEMP/env/bin/python"
          mv "$RUNNER_TEMP/examples-out-of-reach" examples
          "$PY" -m pip uninstall -y supervisor-plugin-reference
          "$PY" -m pip install --no-deps -e examples/reference_plugin
          cd "$RUNNER_TEMP" && "$PY" ci_installed_plugin.py reference --lane reference_lane --python-job reference_count
      - name: a package generated by `supervisor plugin new --package` runs its complete suite
        run: |
          PY="$RUNNER_TEMP/env/bin/python"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/env/bin/supervisor" plugin new ci_sample --package --dir "$RUNNER_TEMP"
          "$PY" -m pip install --no-deps -e "$RUNNER_TEMP/supervisor-plugin-ci-sample"
          cd "$RUNNER_TEMP/supervisor-plugin-ci-sample" && "$PY" -m pytest -q
      - name: a package kept under packages/ is tested the way its own job tests it (tools/ci_package.py)
        # No package is in the repository yet when this runs on 1.14.0, so the per-package job below has nothing to
        # run; this step proves its path on a package scaffolded into packages/ in the runner (never committed).
        run: |
          "$RUNNER_TEMP/env/bin/supervisor" plugin new ci_pkg --package --dir packages
          python tools/ci_package.py run packages/supervisor-plugin-ci-pkg --framework HEAD --workdir "$RUNNER_TEMP/package-ci"

  packages:
    # The plugin packages kept in this repository (packages/<distribution>/, docs/PLUGIN_STANDARD.md), from
    # 1.14.0: each against the oldest framework release in its manifest's range and against HEAD.
    name: packages (list)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the release tags: a package's oldest framework is one of them
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: list
        run: |
          python -m pip install -q "packaging>=23.0"
          python tools/ci_package.py matrix --github-output "$GITHUB_OUTPUT"

  package:
    # Per package and framework: both wheels built (the framework's from its tag or HEAD), a fresh environment, the
    # installed proof (found, loaded, G5, a task on its lane or python job) and the package's suite, with no source
    # on the path. Branch protection requires each package's two jobs.
    name: package ${{ matrix.package }} (framework ${{ matrix.framework }})
    needs: packages
    if: needs.packages.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.packages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python tools/ci_package.py run "packages/${{ matrix.package }}" --framework "${{ matrix.framework }}" --workdir "$RUNNER_TEMP/package-ci"
