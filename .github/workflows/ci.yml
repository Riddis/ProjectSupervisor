# Framework CI (docs/BOUNDARY.md): gate G1 (boundary check), gate G2 (the extension API contract, from 1.11.0),
# gate G3 (the suite on Linux and Windows, the template smoke test included) and gate G5 (the reference extension
# as an installed package, from 1.12.0). They are required checks on main
# through branch protection, so a pull request that fails one cannot merge. A local run gives the same verdict:
#   python -m supervisor.boundary        python -m supervisor.api_contract check        python -m pytest -q
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    name: G1 boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: supervisor.boundary (standard library only, no install)
        run: python -B -m supervisor.boundary

  api_contract:
    name: G2 extension API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history and tags: the previous release's contract is read from its tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: python -m pip install -e ".[ui]"
      - name: supervisor.api_contract check (against the last release tag)
        run: python -B -m supervisor.api_contract check

  suite:
    name: G3 suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: python -m pip install -e ".[dev,ui]"
      - name: pytest
        run: python -m pytest -q

  g5_reference:
    # Gate G5 and the phase 3 gate (docs/EXTENSION_STANDARD.md): the reference extension installed as a package into
    # a fresh environment, with its source out of reach, is discovered through its entry point, approved without
    # import, loaded, passes `supervisor extension check`, and completes a task on its lane. The same as an editable
    # install. A package generated by `supervisor extension new --package` runs its complete suite.
    name: G5 reference extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: the framework into a fresh environment (built, not editable)
        run: |
          PY="$RUNNER_TEMP/env/bin/python"
          python -m venv "$RUNNER_TEMP/env"
          "$PY" -m pip install ".[dev,ui]"
          cp tools/ci_installed_extension.py "$RUNNER_TEMP/"
      - name: the reference extension as a wheel, its source out of reach
        run: |
          PY="$RUNNER_TEMP/env/bin/python"
          "$PY" -m pip wheel --no-deps -w "$RUNNER_TEMP/wheels" examples/reference_extension
          mv examples "$RUNNER_TEMP/examples-out-of-reach"
          "$PY" -m pip install --no-deps "$RUNNER_TEMP"/wheels/supervisor_ext_reference-*.whl
          cd "$RUNNER_TEMP" && "$PY" ci_installed_extension.py reference --lane reference_lane --python-job reference_count
      - name: the reference extension as an editable install
        run: |
          PY="$RUNNER_TEMP/env/bin/python"
          mv "$RUNNER_TEMP/examples-out-of-reach" examples
          "$PY" -m pip uninstall -y supervisor-ext-reference
          "$PY" -m pip install --no-deps -e examples/reference_extension
          cd "$RUNNER_TEMP" && "$PY" ci_installed_extension.py reference --lane reference_lane --python-job reference_count
      - name: a package generated by `supervisor extension new --package` runs its complete suite
        run: |
          PY="$RUNNER_TEMP/env/bin/python"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/env/bin/supervisor" extension new ci_sample --package --dir "$RUNNER_TEMP"
          "$PY" -m pip install --no-deps -e "$RUNNER_TEMP/supervisor-ext-ci-sample"
          cd "$RUNNER_TEMP/supervisor-ext-ci-sample" && "$PY" -m pytest -q
