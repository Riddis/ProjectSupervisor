# project.yaml - what makes this folder a supervisor project. The framework reads it; the setup skill writes it.
name: "{{ name }}"
framework_version: "{{ framework_version }}"   # checked by `supervisor doctor`; `supervisor migrate` updates it

# Phase labels only. Which gates open a phase lives in state/gates.yaml; the tasks of a phase live in state/tasks/.
phases:
  0: "Foundations"

# Plugins by identity: a project module plugins/<name>.py, or an installed plugin package (entry point
# group supervisor.plugins). Each has a manifest, supervisor-plugin.toml, read before anything is imported
# (the framework's docs/PLUGIN_STANDARD.md). A plugin imports only supervisor.plugin (docs/PLUGIN_API.md) and
# registers everything in setup(). `supervisor plugin new <name>` scaffolds one with its manifest and lists it
# here; `supervisor plugin check <name>` proves it conforms.
plugins: []

ui:
  port: 8790
