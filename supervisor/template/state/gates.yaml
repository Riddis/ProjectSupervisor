# Gate status and phase eligibility. A phase's tasks become eligible when every gate in phases.<n>.requires is
# PASSED. Gate values: OPEN | PASSED | FAILED. PASSED needs evidence links and, where the plan says so, owner_ack.
# The setup skill writes the real phases and gates here from the approved plan.
phases:
  0: {requires: []}
gates:
  G0: {status: OPEN, phase: 0, evidence: [], passed_at: null, owner_ack: null}
