[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ distribution }}"
version = "0.1.0"
description = "A Supervisor plugin: {{ identity }}"
readme = "README.md"
requires-python = ">=3.11"
# The framework is not listed: it is not on an index, and the manifest's `framework` range is what the loader checks.
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.entry-points."supervisor.plugins"]
{{ identity }} = "{{ package }}"

[tool.setuptools.packages.find]
include = ["{{ package }}*"]

[tool.setuptools.package-data]
"{{ package }}" = ["supervisor-plugin.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# What CI drives on the installed wheel when this package lives under the framework repository's packages/
# (tools/ci_package.py there): `lane`, `python_job`, and a `config` table for its plugins.<identity> section.
[tool.supervisor.ci]
python_job = "{{ identity }}_hello"
