{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'overview' %}<rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/>
{% elif name == 'check' %}<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
{% elif name == 'jobs' or name == 'log' %}<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8Z"/><path d="M14 3v5h5M9 12h6M9 16h6"/>
{% elif name == 'bell' %}<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
{% elif name == 'flag' or name == 'roadmap' %}<path d="M5 21V3m0 1c5-4 9 4 14 0v10c-5 4-9-4-14 0"/>
{% elif name == 'inbox' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>
{% elif name == 'tasks' %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 12 3 3 5-6"/>
{% elif name == 'agents' %}<circle cx="10" cy="7" r="4"/><path d="M3 21v-3a7 7 0 0 1 14 0v3M17 4a4 4 0 0 1 0 8m3 9v-3a7 7 0 0 0-2-5"/>
{% elif name == 'owner-tasks' %}<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/>
{% elif name == 'chat' %}<path d="M21 11a9 9 0 0 1-9 9H4l-3 2 2-7a9 9 0 1 1 18-4Z"/>
{% elif name == 'settings' %}<path d="m10 2-1 3-3 1-3-1-2 4 2 3-1 3 2 4 4-1 2 3h4l1-3 3-1 3 1 2-4-2-3 1-3-2-4-4 1-2-3Z"/><circle cx="12" cy="12" r="3"/>
{% elif name == 'play' %}<path d="m7 4 14 8-14 8Z" fill="currentColor" stroke="none"/>
{% elif name == 'pause' %}<path d="M8 5v14M16 5v14" stroke-width="4"/>
{% elif name == 'stop' %}<rect x="5" y="5" width="14" height="14" rx="1" fill="currentColor" stroke="none"/>
{% elif name == 'reload' %}<path d="M20 7v5h-5M20 12a8 8 0 1 0-2 6"/>
{% elif name == 'doctor' %}<path d="M4 3v5a5 5 0 0 0 10 0V3M2 3h4m6 0h4M9 13v3a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="11" r="3"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'cpu' %}<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/>
{% elif name == 'disk' %}<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 14h18M16 17h2"/>
{% elif name == 'claude' %}<path d="M12 2v20M2 12h20M5 5l14 14M5 19 19 5M8 3l8 18M3 8l18 8M3 16l18-8M8 21 16 3" stroke-width="2.2"/>
{% elif name == 'codex' %}<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16" stroke-width="2"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'power' %}<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>
{% endif %}
</svg>
{%- endmacro %}
