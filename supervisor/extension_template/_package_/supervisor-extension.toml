# The extension's manifest (docs/EXTENSION_STANDARD.md in the framework repo). The framework reads it before importing
# anything here: keep it in step with what setup() registers (`supervisor extension check {{ identity }}` proves it).
identity = "{{ identity }}"
version = "0.1.0"
framework = "{{ framework_range }}"

[provides]
python_jobs = ["{{ identity }}_hello"]
doctor_checks = ["{{ identity }}"]

[config]
section = "extensions.{{ identity }}"
schema = "{{ package }}.config:Settings"
