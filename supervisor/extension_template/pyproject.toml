[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ distribution }}"
version = "0.1.0"
description = "A Supervisor extension: {{ identity }}"
readme = "README.md"
requires-python = ">=3.11"
# The framework is not listed: it is not on an index, and the manifest's `framework` range is what the loader checks.
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.entry-points."supervisor.extensions"]
{{ identity }} = "{{ package }}"

[tool.setuptools.packages.find]
include = ["{{ package }}*"]

[tool.setuptools.package-data]
"{{ package }}" = ["supervisor-extension.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
